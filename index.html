function segs(t){ const out=[]; String(t).split(/(\[\[.*?\]\])/).forEach(p=>{ if(!p) return; if(p.startsWith('[[')) out.push({t:Array.from(p.slice(2,-2)),kw:true}); else out.push({t:Array.from(p),kw:false}); }); return out; }
function partial(sg,n){ let html='', left=n; for(const s of sg){ if(left<=0) break; const take=s.t.slice(0,left).join(''); left-=s.t.length; html+=s.kw?`<span class="kw">${esc(take)}</span>`:esc(take); } return html; }
let typing=null, advanceResolver=null, skipCurrent=null;
function typeText(text,who){
  textEl.classList.toggle('thought',/^\s*[(（]/.test(String(text)));
  if(typing){ clearTimeout(typing.timer); const old=typing; typing=null; old.resolve(); }
  return new Promise(resolve=>{
    const sg=segs(text), total=sg.reduce((a,s)=>a+s.t.length,0), flat=sg.flatMap(s=>s.t);
    let n=0; textEl.innerHTML=''; charEl.classList.add('talking');
    const t={timer:null,resolve:resolve,finish:null};
    if(window.__yjFast){ textEl.innerHTML=partial(sg,total); typing=null; resolve(); return; }
    t.finish=()=>{ clearTimeout(t.timer); textEl.innerHTML=partial(sg,total); charEl.classList.remove('talking'); if(typing===t) typing=null; resolve(); };
    const tick=()=>{
      if(typing!==t) return;
      if(n>=total){ t.finish(); return; }
      const ch=flat[n++]; textEl.innerHTML=partial(sg,n);
      if(n%2===1 && ch.trim()) SFX.blip(who);
      t.timer=setTimeout(tick,(/[.!?…,]/.test(ch)?110:26)*TEXT_SPEED[textSpeed].f);
    };
    if(TEXT_SPEED[textSpeed].f===0){ typing=t; t.finish(); return; }
    typing=t; tick();
  });
}

async function examine(p0){

  track('inv_look',{loc:invLoc.id,spot:p.label,ev:p.ev||''});
  if(p.need && !S.found.has(p.need)){ for(const t of (p.lockedSay||['잠겨 있다.'])){ if(S.invSkip) break; await say(ME(),'think',t,{view:'inv'}); } renderSpots(); S.busy=false; return; }

  const gets=(p.gives||[]).concat(p.ev?[p.ev]:[]).filter(id=>!S.found.has(id));

}

function pwHash(v){ const h=s=>{ let x=0x811c9dc5; for(const b of new TextEncoder().encode(s)){ x^=b; x=Math.imul(x,0x01000193)>>>0; } return x>>>0; }; let r='yj-teacher:'+v; for(let i=0;i<1000;i++) r=h(r+i).toString(16).padStart(8,'0')+r.slice(0,8); return r.slice(0,8); }

document.addEventListener('keydown',e=>{
  if(e.target instanceof HTMLInputElement) return;
  const k=e.key;
  if(!sheetEl.hidden){
    if(k==='Escape' && sheetCloseable){ closeSheet(); return; }
    if((k==='l'||k==='L'||k==='ㅣ') && sheetCard.querySelector('[data-act=hist]')){ e.preventDefault(); sheetCard.querySelector('[data-act=hist]').click(); return; }
    if(recNav && (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter','e','E'].includes(k)||/^[1-9]$/.test(k))){ e.preventDefault(); recNav(k); }
    return;
  }
  if((k==='l'||k==='L'||k==='ㅣ')){ e.preventDefault(); openHistory(null); return; }
  if(S.pendingPick && (k==='e'||k==='E'||k==='ㄷ')){ e.preventDefault(); S.pendingPick(); return; }
  // 돋보기 조사
  if(S.mode==='inv' && !moving){
    if(k==='a'||k==='A'||k==='ㅁ'){ e.preventDefault(); invGo(()=>roomStep(-1)); return; }
    if(k==='d'||k==='D'||k==='ㅇ'){ e.preventDefault(); invGo(()=>roomStep(1)); return; }
    if((k==='t'||k==='T'||k==='ㅅ') && npcOf(invLoc)){ e.preventDefault(); invGo(talkTo); return; }
    if((k==='p'||k==='P'||k==='ㅔ') && npcOf(invLoc)){ e.preventDefault(); invGo(()=>showTo(null)); return; }
    if(['1','2','3'].includes(k)){ e.preventDefault(); const L=availLocs()[+k-1]; if(L) invGo(()=>goLoc(L.id)); return; }
  }
  if(S.mode==='inv' && !moving && sheetEl.hidden){
    if(LENS_DIR[k]){ e.preventDefault(); if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();
      if(!S.busy){ if(!lensHeld[k]){ lensHeld[k]=performance.now(); const d=LENS_DIR[k]; moveLens(d[0]*1.2,d[1]*1.2); } lensFast=e.shiftKey; startLensLoop(); } return; }
    if(k==='Enter'||k===' '||k==='e'||k==='E'){ e.preventDefault(); if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();
      if(advanceResolver||typing||skipCurrent) onAdvance(); else if(!S.busy) examineAt(); return; }
  }
  // 추궁 단축키: Space·→ 다음, ← 이전, F 더 묻기, E 증거 제시
  if(!controlsEl.hidden && !S.busy && !skipCurrent){
    if(k===' '||k==='ArrowRight'){ e.preventDefault(); $('#bNext').click(); return; }
    if(k==='ArrowLeft'){ e.preventDefault(); $('#bPrev').click(); return; }
    if(k==='f'||k==='F'||k==='ㄹ'){ e.preventDefault(); doPress(); return; }
    if(k==='e'||k==='E'||k==='ㄷ'){ e.preventDefault(); if(CX) openRecord(!document.body.classList.contains('judge-mode')); return; }
    if((k==='s'||k==='S'||k==='ㄴ') && CX && CX.T.habit){ e.preventDefault(); doObserve(); return; }
  }
  if((k==='Enter'||k===' ') && !(e.target instanceof HTMLButtonElement)){ e.preventDefault(); onAdvance(); }
});

/* 판결: 이유를 고르고, 그 이유의 근거 증거를 낸다 */
async function reasonEv(q,opts,prompt){
  S.allowUsed=true;
  for(;;){
    const c=await choiceSheet(q,opts);
    if(!c.ok){ await say('judge','stern',c.fb||'그 이유로는 판결할 수 없소.'); await loseTrust(); if(S.trust<=0){ S.allowUsed=false; await loseTrial(); return false; } continue; }
    S.expect=c.ev; let id=await pickEvidence(prompt||'그 이유를 뒷받침하는 증거를 고르세요.'); S.expect=null;
    while(c.soft && c.soft[id]){ track('soft_ev',{q:q,ev:id}); await line(c.soft[id]); S.expect=c.ev; id=await pickEvidence('함께 낼 다른 근거를 고르세요.'); S.expect=null; }
    track('reason',{q:q,a:c.t,ev:id,ok:c.ev.includes(id)});
    { const be=EV_BY_ID[id]; if(c.before!==undefined && be && typeof be.y==='number' && be.y>c.before && !c.ev.includes(id)){ track('time_order',{q:q,ev:id}); await say('judge','stern',`${yearTxt(be.y)}의 일이 ${yearTxt(c.before)}의 이유가 될 수는 없소. [[시간 순서]]를 보시오.`); await loseTrust(); if(S.trust<=0){ S.allowUsed=false; await loseTrial(); return false; } continue; } }
    if(EV_BY_ID[id]&&EV_BY_ID[id].gag&&!c.ev.includes(id)){ await line([['judge','stern','…판결의 근거로 [[메밀묵]]을 내는 사람은 처음 보오.'],['ttolbang','shock','앗, 그거 제 거예요!']]); await loseTrust(); if(S.trust<=0){ S.allowUsed=false; await loseTrial(); return false; } continue; }
    if(c.ev.includes(id)){ showEvidence(id); await say(ME(),'present',`근거는 ‘${EV_BY_ID[id].title}’입니다.`); hideEvidence(); await say('judge','normal','이유와 근거가 맞소.'); await gainTrust(); S.allowUsed=false; return true; }
    const bad=EV_BY_ID[id];
    if(bad&&bad.fake&&S.zoomed&&S.zoomed.has(id)) await say('judge','stern','확대해 보고도 낸 그 종이에는 [[매화 얼룩]]이 있소. 누가 썼는지 알 수 없는 종이는 근거가 될 수 없소.');
    else if(bad&&bad.fake) await say('judge','stern','그 종이는 누가 썼는지 알 수 없소. [[근거에서 빼시오]].');
    else if(bad&&bad.trap) await say('judge','stern',bad.trap);
    else if(bad&&bad.trust===1) await say('judge','stern','[[전해 들은 말]]은 근거가 약하오. 직접 본 사람의 말이나 기록으로 뒷받침하시오.');
    else await say('judge','stern','그 증거는 이 이유를 뒷받침하지 못하오.');
    await loseTrust(); if(S.trust<=0){ S.allowUsed=false; await loseTrial(); return false; }
  }
}
/* 하루 끝 요약: 찾은 증거, 깬 거짓, 남은 방울, 오늘 알게 된 것, 피고에 대한 인상 */
function dayStart(){ S.dayMark={found:new Set(S.found||[]),log:(S.log||[]).length,t:Date.now()}; }
function dayPause(n,learned){
  const M=S.dayMark||{found:new Set(),log:0,t:Date.now()};
  const newEv=[...(S.found||[])].filter(id=>!M.found.has(id)&&realEv(id));
  const hits=(S.log||[]).slice(M.log).filter(x=>x.ok).length, wrongs=(S.log||[]).slice(M.log).filter(x=>!x.ok).length;
  const D=CASE_DATA[S.case], L=learned||(D&&D.learned&&D.learned[n])||null, who=(D&&D.defName)||(S.case===2?'위만':'의자왕');
  const mins=Math.max(1,Math.round((Date.now()-M.t)/60000));
  track('day_end',{day:n,newEv:newEv.length,hits:hits,wrongs:wrongs,trust:S.trust,mins:mins});
  return new Promise(res=>{
    openSheet(`<h2>${n}일차가 끝났습니다</h2>
      <div class="stats day-sum"><div class="stat">오늘 찾은 증거<b>${newEv.length}개</b></div><div class="stat">깬 거짓<b>${hits}개</b></div><div class="stat">헛 제시<b>${wrongs}번</b></div><div class="stat">남은 해치 방울<b>${S.storyMode?'—':S.trust+'/'+bellsMax()}</b></div></div>
      ${newEv.length?`<p class="day-ev">${newEv.map(id=>`<span class="chip">${esc(EV_BY_ID[id].title)}</span>`).join(' ')}</p>`:''}
      ${L?`<h3>오늘 알게 된 것</h3><ol class="learned">${L.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}
      <h3>지금 ${esc(who)}에 대한 내 생각은?</h3>
      <div class="seg imp" role="group" aria-label="피고에 대한 인상">${[['good','좋다'],['unsure','모르겠다'],['bad','나쁘다']].map(x=>`<button type="button" data-imp="${x[0]}" aria-pressed="false">${x[1]}</button>`).join('')}</div>
      <p class="lead">여기까지 자동으로 저장했어요. 수업을 여기서 끊어도, 다음 시간에 첫 화면의 <b>이어 하기</b>로 ${n+1}일차부터 이어 갈 수 있어요.</p>
      <div class="sheet-foot"><button class="abtn" id="pStop" type="button">여기서 멈추기</button><button class="abtn primary" id="pGo" type="button">${n+1}일차 시작</button></div>`,false);
    let imp=null;
    sheetCard.querySelectorAll('[data-imp]').forEach(b=>b.addEventListener('click',()=>{ imp=b.dataset.imp; Music.sting('click'); sheetCard.querySelectorAll('[data-imp]').forEach(x=>{ x.classList.toggle('sel',x===b); x.setAttribute('aria-pressed',x===b?'true':'false'); }); }));
    const done=go=>{ track('impression',{day:n,v:imp||'skip'}); closeSheet(); if(!go) backToRoles(); else dayStart(); res(go); };
    $('#pGo').addEventListener('click',()=>done(true));
    $('#pStop').addEventListener('click',()=>done(false));
  });
}

function resumeStory(){
  S.storyMode=false; S.case=1; S.role='pros';
  const v=hasSave(); if(!v){ startStory(); return; }
  prepStory();
  if(v.variant!==undefined){ S.variant=v.variant; S.lines=buildLines(v.variant); }
  S.found=new Set(v.found); S.seen=new Set(v.seen||[]); S.trust=v.trust||bellsMax(); S.misses=v.misses||0; S.presses=v.presses||0; S.log=v.log||[]; S.used=new Set(v.used||[]); S.talked=new Set(v.talked||[]); S.unlocked=new Set(v.unlocked||[]); S.p2at=3;
  if(v.flags) S.flags=v.flags; if(v.verdicts) S.verdicts=v.verdicts;
  gagEv(); renderGauge(); track('start',{resume:true,from:v.phase}); runStory(v.phase);
}

async function fillMissing(ids){

/* ---------- 고르기 창 ---------- */
function choiceSheet(q,opts){
  return new Promise(res=>{
    const o=shuffle(opts); window.__yjOpts=o;
    openSheet(`<h2>답하기</h2><p class="lead">${esc(q)}</p><div class="choices">${o.map((x,i)=>`<button class="choice" type="button" data-i="${i}"><span class="ck">${i+1}</span>${esc(x.t)}</button>`).join('')}</div>`,false);
    const fin=x=>{ track('choice',{q:q,a:x.t,ok:x.ok===undefined?'':!!x.ok,tag:x.tag||''}); res(x); };
    sheetCard.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{ Music.sting('click'); closeSheet(); fin(o[+b.dataset.i]); }));
    recNav=k=>{ const n=parseInt(k,10); if(n>=1&&n<=o.length){ closeSheet(); fin(o[n-1]); } };
  });
}
function pickEvidence(lead){
  return new Promise(res=>{
    const open=()=>{
      S.pendingPick=null; $('#pickHint').hidden=true; S.pickOpen=open;
      openRecord(true);
      const h=sheetCard.querySelector('.lead'); if(h) h.innerHTML=esc(lead);
      presentHandler=id=>{ S.pendingPick=null; S.pickOpen=null; $('#pickHint').hidden=true; onSheetClose=null; closeSheet(); res(id); };
      onSheetClose=()=>{ S.pendingPick=open; $('#pickHint').hidden=false; };   // 닫으면 대화를 다시 볼 수 있고, 수첩 단추·E로 다시 연다
    };
    open();
  });
}

async function deliverVerdictStory(){
  closeSheet(); bgm('open');

  await say('judge','stern',`그러나 ${S.B.t}은 피고 자신의 선택이었습니다. 혐의 ①은 [[책임 있음]]입니다. 벌하지는 않지만, 역사에 [[영원히 기록]]합니다.`);
  await say('judge','normal','사비성 백성의 진술처럼, 그 선택의 무게는 백성이 짊어졌습니다.');
  await say('judge','normal','혐의 ②. ‘3천 궁녀’는 근거가 없고, 656년 기록 하나로는 향락이 나라를 망하게 했다는 것까지 증명되지 않습니다. [[증명 부족]]입니다.');
  await say('judge','stern','다만 판결 이유에 남깁니다. 656년의 향락 기록은 있으며, 그것이 고려 때 쓴 기록이라는 점을 함께 따졌습니다.');
  bgm('verdict'); await gavel();
  await say('defendant','sweat','…….');
  if(!S.C.ok) await say('judge','normal','(검사의 판결문 초안은 혐의 ②를 다르게 보았지만, 재판부는 증거에 따라 판결했습니다.)');
  await storyEnding();
}
async function storyEnding(){
  bgm('verdict');
  await say('rival','normal','혐의 ①은 졌지만, 혐의 ②를 지킨 건 저예요.',{view:'courtyard'});
  await say('player','confident','덕분에 증거로 따진다는 게 뭔지 알았어.',{view:'courtyard'});
  await say('judge','normal','역사 법정에서 이기는 쪽은 언제나 [[증거]]요.',{view:'courtyard'});

  await caseFinale();
  track('case_end',{grade:tierOf(score().total).name,trust:S.trust,wrongs:S.log.filter(x=>!x.ok).length});
  S.done=true; S.inTrial=false; clearSave(); openResult();
}
/* 재판이 끝난 빈 법정: 기록관이 붓을 줍다 소매에 매화 모양 먹이 번진다. 해치가 서고를 맡긴다 */
async function scribeArchive(){
  Music.stop(1); await wait(600);
  await say('guide','normal','(모두가 돌아간 빈 법정. 기록관이 바닥에 떨어진 붓을 천천히 줍는다.)',{view:'witness'});
  await say('scribe2','sweat','…내 붓이.');
  Music.sting('drip'); flash();
  await say('guide','normal','(붓끝에 남은 먹이 소매에 번졌다. 작은 [[매화 모양]]이다.)');
  await say('judge','normal','그대는 기록을 아끼는 사람이오. 오늘은 그대를 몰아세웠지만, 그 마음까지 틀린 것은 아니오.');
  await say('judge','normal','이제부터 이 법정의 [[서고]]를 지키시오. 모든 사건의 증거 보관함이 그곳에 있소.');
  await say('scribe2','base','…분부대로 하겠소.');
  await say('scribe2','base','(…기록이 틀릴 수 있다면… 기록은 [[무엇이든 될 수 있는]] 것 아니오?)',{tag:'혼잣말'});
  Music.sting('thud'); await wait(500);
}

/* ---------- 학습 데이터 (공통 규칙 2장) ----------
   {t, sid, case, role, day, kind, detail} 를 기기 안에만 쌓는다. 실명은 받지 않고 학급 번호나 별명만.
   교사가 내려받을 때만 밖으로 나간다 (CSV). */
const EVKEY='yj-events', EVMAX=12000;
function loadEvents(){ try{ return JSON.parse(store.get(EVKEY)||'[]')||[]; }catch(e){ return []; } }
function track(kind,detail){
  try{
    const E=loadEvents();
    E.push({t:Date.now(),sid:store.get('yj-sid')||'',case:S.case||1,role:S.role||(S.me==='rival'?'def':S.me==='daon'?'judge':'pros'),day:S.day||S.phase||0,kind:kind,detail:detail||{}});
    if(E.length>EVMAX) E.splice(0,E.length-EVMAX);
    store.set(EVKEY,JSON.stringify(E));
  }catch(e){}
}
const KIND_KO={start:'시작',move:'장소 이동',inv_look:'조사',inv_miss:'헛짚음',ev_found:'증거 얻음',hint_place:'장소 힌트',talk:'이야기',show:'보여 주기',press:'더 묻기',present:'증거 제시',hint_line:'해치 힌트',choice:'고르기',reason:'판결 이유',pick:'증거 고르기',zoom:'증거 확대',observe:'버릇 살피기',claim:'주장 가르기',term:'용어 카드',day_end:'하루 끝',impression:'피고 인상',lose:'방울 모두 깨짐',case_end:'사건 끝',shadow_replay:'그림자 다시 보기'};
function csvCell(v){ const s=String(v===undefined||v===null?'':v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function eventsCSV(E){
  const head=['시각','번호_별명','사건','역할','일차','종류','종류_한글','내용'];
  const pad=n=>String(n).padStart(2,'0');
  const ts=t=>{ const d=new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
  return '﻿'+[head.join(',')].concat(E.map(e=>[ts(e.t),e.sid,e.case,e.role,e.day,e.kind,KIND_KO[e.kind]||e.kind,JSON.stringify(e.detail)].map(csvCell).join(','))).join('\n');
}
const ROLE_KO={pros:'검사',def:'변호인',judge:'판사'};
/* 학생별 요약: 며칠째, 어디서 막혔는지 */
function eventSummary(E){
  const G={};
  E.forEach(e=>{ const k=(e.sid||'(이름표 없음)')+'|'+e.case+'|'+e.role; const g=G[k]||(G[k]={sid:e.sid||'(이름표 없음)',case:e.case,role:e.role,day:0,miss:{},wrong:{},hints:0,first:e.t,last:e.t,end:null,imp:[]});
    g.day=Math.max(g.day,+e.day||0); g.last=Math.max(g.last,e.t); g.first=Math.min(g.first,e.t);
    if(e.kind==='inv_miss') g.miss[e.detail.loc]=(g.miss[e.detail.loc]||0)+1;
    if(e.kind==='present'&&!e.detail.ok){ const w=(e.detail.key||'증언')+' '+e.detail.line+'번째 말'; g.wrong[w]=(g.wrong[w]||0)+1; }
    if(e.kind==='claim'&&!e.detail.ok){ const w='주장 가르기'; g.wrong[w]=(g.wrong[w]||0)+1; }
    if(e.kind==='hint_line'||e.kind==='hint_place') g.hints++;
    if(e.kind==='impression') g.imp.push(({good:'좋다',unsure:'모르겠다',bad:'나쁘다',skip:'-'})[e.detail.v]||'-');
    if(e.kind==='case_end') g.end=e.detail.grade||'끝냄'; });
  const top=o=>{ const a=Object.entries(o).sort((x,y)=>y[1]-x[1])[0]; return a?`${a[0]} (${a[1]}번)`:'-'; };
  return Object.values(G).sort((a,b)=>b.last-a.last).map(g=>({sid:g.sid,cr:`사건 ${g.case} · ${ROLE_KO[g.role]||g.role}`,day:g.end?'끝냄':(g.day?g.day+'일차':'-'),miss:top(g.miss),wrong:top(g.wrong),hints:g.hints,imp:g.imp.join('→')||'-',end:g.end||'-',mins:Math.max(1,Math.round((g.last-g.first)/60000))}));
}

/* 4일 진행: 날마다 [조사] → [법정] → 하루 끝. days[i] = {inv, court, learned} */
async function playDays(days,from){
  for(let d=1;d<=days.length;d++){
    const D=days[d-1], pi=2*d-1, pc=2*d;
    if(from<=pi && D.inv){ saveAtX(pi); S.day=d; await titleCard(d+'일차','조사'); await D.inv(); }
    if(from<=pc){ saveAtX(pc); S.day=d; if(!await D.court()) return false;
      if(d<days.length){ saveAtX(pc+1); if(!await dayPause(d,D.learned)) return false; } }
  }
  return true;
}

/* 고르기: 틀린 답(ok:false)은 방울 −1 후 다시. 정답이 하나가 아닌 갈림길은 모든 답에 ok:true */
async function choose(q,opts,o){
  o=o||{}; let miss=0;
  for(;;){
    const c=await choiceSheet(q,opts);
    if(c.ok!==false){ if(opts.some(x=>x.ok===false)&&!o.noGain) await gainTrust(); return c; }
    miss++; await say(o.who||'judge',o.expr||'stern',c.fb||'그 답으로는 안 되오.');
    if(miss===2&&o.hint) await say('judge','normal',o.hint);
    await loseTrust(); if(S.trust<=0){ await loseTrial(); return null; }
  }
}
/* 증거 고르기: ids 가운데 하나를 낼 때까지. 전해 들은 말·가짜 기록은 따로 꾸짖음 */
async function presentFor(lead,ids,o){
  o=o||{}; let miss=0;
  for(;;){
    S.expect=ids; if(o.allowUsed) S.allowUsed=true; const id=await pickEvidence(lead); S.expect=null; if(o.allowUsed) S.allowUsed=false;
    const ok=ids.includes(id); track('pick',{lead:lead,ev:id,ok:ok});
    if(ok){ if(!o.quiet){ showEvidence(id); await say(ME(),'present',o.say?o.say(EV_BY_ID[id]):`‘${EV_BY_ID[id].title}’입니다!`); hideEvidence(); } if(!o.noGain) await gainTrust(); return id; }
    const bad=EV_BY_ID[id]; miss++;
    if(bad&&bad.fake) await say('judge','stern','그 종이는 누가 썼는지 알 수 없소. 증거 수첩에서 [[확대해]] 보시오.');
    else if(bad&&bad.trap) await say('judge','stern',bad.trap);
    else if(bad&&bad.trust===1&&!o.allowHearsay) await say('judge','stern','[[전해 들은 말]]은 근거가 약하오.');
    else await say('judge','stern',o.fb||'그 증거로는 보일 수 없소.');
    if(miss===2&&o.hint) await say('judge','normal',o.hint);
    await loseTrust(); if(S.trust<=0){ await loseTrial(); return null; }
  }
}
/* 두 증거 맞대기 (증언 밖에서): 두 증거를 차례로 고른다 */
async function presentPair(lead,a,b,o){
  o=o||{};
  const first=await presentFor(lead+' (첫 번째)',[a,b],{quiet:true,noGain:true,allowUsed:true,hint:o.hint}); if(!first) return null;
  const other=first===a?b:a;
  const second=await presentFor(`‘${EV_BY_ID[first].title}’와(과) 맞댈 두 번째 증거를 고르세요.`,[other],{quiet:true,noGain:true,allowUsed:true,hint:o.hint}); if(!second) return null;

  await gainTrust(); track('pair',{a:first,b:second}); return [first,second];
}

/* 판사 모드: 주장 가르기 (확인됨 / 확인 안 됨 / 의견일 뿐 / 받아들일 수 없음) */
const CLAIM_OPTS={ok:'증거로 확인됨',no:'확인 안 됨',op:'의견일 뿐',bad:'받아들일 수 없는 주장 (원칙에 어긋남)'};
const CLAIM_FB={ok:'증거가 있는 주장을 확인 안 된 것으로 보았소.',no:'그 주장을 뒷받침하는 증거는 아직 없소. 오히려 반대되는 증거가 있지 않소?',op:'그것은 사실이 아니라 말하는 사람의 생각이오. 확인할 수 있는 일이 아니오.',bad:'이 주장은 증거 문제가 아니라, 법의 원칙에 어긋나오.'};
async function sortClaims(list,o){
  o=o||{}; const stage=o.stage||3;
  for(const C of list){
    await say(C.who,C.expr||'confident',C.text,{tag:'주장'});
    if(stage===1&&C.ans==='op'){ await say('judge','normal',C.demo||'이런 말은 좋다·나쁘다를 말하는 [[생각]]이오. 내일부터는 이런 주장을 ‘의견일 뿐’으로 가르게 될 것이오.'); if(C.after) await line(C.after); continue; }
    const keys=(stage===1?['ok','no']:['ok','no','op']).concat(C.ans==='bad'||o.withBad?['bad']:[]);
    let miss=0;
    for(;;){
      const c=await choiceSheet(`주장 가르기: “${plain(C.text)}”`,keys.map(k=>({t:CLAIM_OPTS[k],ok:k===C.ans,k:k})));
      track('claim',{text:plain(C.text).slice(0,60),pick:c.k,ans:C.ans,ok:c.ok});
      if(c.ok){ break; }
      miss++; S.claimMiss=(S.claimMiss||0)+1;
      await say('judge','stern',(C.fb&&C.fb[c.k])||CLAIM_FB[C.ans]);
      if(miss===2) await say('judge','normal','…판사, 하나만 일러 주겠소. [[확인됨]]은 증거가 있을 때, [[확인 안 됨]]은 증거가 없거나 반대 증거가 있을 때, [[의견일 뿐]]은 좋다·나쁘다 같은 생각을 말할 때요.');
      await loseTrust(); if(S.trust<=0){ await loseTrial(); return false; }
    }
    if(C.ev){ const id=await presentFor(C.ans==='ok'?'이 주장을 확인해 주는 증거를 고르세요.':C.ans==='bad'?'이 주장을 막는 원칙 카드를 고르세요.':'이 주장이 확인되지 않는 까닭을 보여 줄 증거를 고르세요.',C.ev,{noGain:true,allowUsed:true}); if(!id) return false; }
    else if(stage>=3&&C.ans==='no'){ const w=await choose('왜 ‘확인 안 됨’인가요?',[{t:'이것을 증명할 기록이 아직 없다.',ok:true},{t:'반대되는 증거가 이미 있다.',ok:false,fb:'반대 증거가 있는 것이 아니라, 증명할 기록이 아직 없는 것이오. 빠진 것이 무엇인지 보시오.'}],{noGain:true}); if(!w) return false; }
    if(stage>=3&&C.ans==='op'&&C.opPhrase){ const parts=plain(C.text).split(C.opPhrase); const opts=[{t:C.opPhrase,ok:true}].concat(parts.map(x=>x.trim()).filter(x=>x.length>1).map(x=>({t:x,ok:false,fb:'그 부분은 확인할 수 있는 일이오. 말하는 사람의 생각이 담긴 말을 찾으시오.'}))); const w=await choose('이 주장에서 ‘생각(의견)’이 담긴 말은 어디인가요?',opts,{noGain:true}); if(!w) return false; }
    if(C.after) await line(C.after);
    await gainTrust();
  }
  return true;
}

/* ===== v4 공통 장치 (「역사재판_ClaudeCode_인계_v4」 단계 A·B) =====
   방울(연습 보호·적응형), 3단계 힌트, 판결 네 갈래와 원칙 카드, 수상한 종이 묶음, 법관 등급, 판결 뒤 '가장 중요한 것',
   오늘의 역할·한 줄 배경 카드·지난 사건 회상, 연표(증거 연도), 증거 꼬리표, 개그(똘방·말순 할머니·박수 아저씨·메밀묵),
   판사 모드 다듬기(단계별 주장 가르기, 재증언 명령, 판결 저울), 심화 추궁(명탐정 도장), 이야기 모드 */

/* ---------- 사건별 덧붙임 자료: 사건 3부터는 regCase에, 사건 1·2는 여기 ---------- */
const CASE_EXTRA={};
const XD=n=>Object.assign({},CASE_EXTRA[n]||{},CASE_DATA[n]||{});

/* ---------- 방울: 연습 보호(사건 1·2는 일곱 개)와 적응형 난이도 ---------- */
function practiceCase(){ return (S.case||1)<=2; }
function adaptState(){ try{ return JSON.parse(store.get('yj-adapt')||'null'); }catch(e){ return null; } }
function adaptOn(){ const a=adaptState(); return !!(a&&a.case===(S.case||1)); }
/* 게임 오버 뒤: 그 사건 동안 방울 +1, 힌트 1단계부터. 다음 사건을 시작하면 그 사건 1일차까지 이어 준다 */
function adaptLose(){ store.set('yj-adapt',JSON.stringify({case:S.case||1,carry:false})); track('adapt',{on:true}); }
function adaptEnter(n){ const a=adaptState(); if(!a||a.case===n) return; store.set('yj-adapt',a.carry?'null':JSON.stringify({case:n,carry:true})); }
function adaptDay(day){ const a=adaptState(); if(a&&a.carry&&a.case===(S.case||1)&&day>=2) store.set('yj-adapt','null'); }
function bellsMax(){ return S.storyMode?5:((practiceCase()?7:5)+(adaptOn()?1:0)); }

/* ---------- 힌트 3단계: 거짓 개수 → ○번째 말 → 관련 증거의 종류 (증거 자체는 알려 주지 않음) ---------- */
const EVTYPE_KO={사료:'옛 기록(사료)',물건:'물건',증언:'사람의 증언',유적:'유적',유물:'유물',문서:'문서',연표:'연표'};
async function hintStage(){
  if(!CX||S.trust<=0) return;
  const early=practiceCase()||adaptOn()||S.storyMode;
  const st=Math.min(3,(CX.miss||0)-(early?0:1)+(S.storyMode?1:0));
  if(st<1||st<=(CX.hintSt||0)) return;
  CX.hintSt=st;

  const L=T.lines[open[0]], ids=L.need2||[].concat(L.ev||[]);

}

/* ---------- 판결 네 갈래와 원칙 카드 「죄와 책임은 다르다」 ---------- */
const VK={guilty:'유죄',resp:'책임 있음',innocent:'무죄',unproven:'증명 부족·판단 보류'};

function principleHTML(){ return `<div class="principle"><b>원칙 카드 「죄와 책임은 다르다」</b><p>죄는 ‘한 일’로, 책임은 ‘그 결과’로 따진다.</p><small>친구 물건을 몰래 가져간 것은 죄, 반장이 반을 잘못 이끌어 모두 힘들어진 것은 책임이에요. 책임을 따질 때는 “경고를 알고도 무시했는가”도 봐요.</small></div>`; }
function kindFb(p,a){
  if(p==='guilty'&&a==='resp') return '이것은 나라를 위한 [[판단]]이 낳은 결과요. 죄는 사람에게 직접 해를 끼친 [[행위]]를 따지는 것이오.';

  if(p==='innocent'&&(a==='guilty'||a==='resp')) return '증거로 보아 피고가 한 일, 또는 그 결과의 [[무게]]가 남아 있소. 없던 일로 할 수는 없소.';

  if(p==='unproven'&&a==='innocent') return '증거로 보아 판단이 갈릴 일이 아니오. 죄도 책임도 묻기 어렵다는 것이 드러났소.';
  return '그 판결은 증거와 맞지 않소.';

function kindSheet(charge,okSet,o){

/* 혐의 하나의 판결 종류를 고른다. 처음 틀리면 방울 대신 원칙 카드로 설명, 두 번째부터 −1 */
async function verdictKind(charge,ans,o){
  o=o||{}; const okSet=[].concat(ans); let tries=0; S.verdicts=S.verdicts||[];
  for(;;){
    const pick=await kindSheet(charge,okSet,o); tries++;
    const ok=okSet.includes(pick);
    track('verdict_kind',{charge:plain(charge).slice(0,40),pick:pick,ans:okSet.join('|'),ok:ok,try:tries});
    if(ok){ S.verdicts.push({charge:plain(charge),kind:pick,first:tries===1}); if(o.idx!==undefined) chargeSt(o.idx,pick,o.note); Music.sting('realize'); if(tries===1) await gainTrust(); return pick; }
    S.vkMiss=(S.vkMiss||0)+1;
    await say('judge','stern',(o.fb&&o.fb[pick])||kindFb(pick,okSet[0]));
    if(S.vkMiss===1){ await say('judge','normal','판결의 종류를 처음 틀렸으니 방울은 깨지 않겠소. [[원칙 카드]]를 다시 보고 고르시오.'); continue; }
    await loseTrust(); if(S.trust<=0){ await loseTrial(); return null; }
  }
}

/* ---------- 법관 등급: 정확한 판결 수(처음 고른 판결 종류가 맞은 수)로 오른다 ---------- */
const RANKS=[[0,'새내기 법관'],[4,'수습 법관'],[10,'법관'],[18,'명판관']];
function rankOf(sum){ let name=RANKS[0][1]; RANKS.forEach(r=>{ if(sum>=r[0]) name=r[1]; }); return name; }
function rankUpdate(){
  const n=S.case||1, V=S.verdicts||[], c=V.filter(v=>v.first).length; let R={};
  try{ R=JSON.parse(store.get('yj-rank')||'{}')||{}; }catch(e){}
  R[n]=Math.max(R[n]||0,c); store.set('yj-rank',JSON.stringify(R));
  const sum=Object.values(R).reduce((a,b)=>a+b,0), name=rankOf(sum);
  const nx=RANKS.find(r=>r[0]>sum);
  return {correct:c,total:V.length,sum:sum,name:name,next:nx?`${nx[1]}까지 ${nx[0]-sum}`:''};
}

/* ---------- 학급 연표 (교사 화면): 반 전체가 함께 채우는 연표 판 ----------
   이 기기의 학습 데이터에 다른 기기에서 내려받은 기록 파일을 합쳐, 사건마다 끝낸 친구·내린 판결·모은 수상한 종이를 연표 위에 놓는다.
   합친 기록도 이 기기 안(yj-class)에만 두고, 판에 필요한 기록만 남긴다. 이름 대신 번호나 별명. */
const CLASSKEY='yj-class', CLASSMAX=40000, BOARD_KINDS=['start','day_end','case_end','verdict_kind','paper'];
function loadClassEvents(){ try{ return JSON.parse(store.get(CLASSKEY)||'[]')||[]; }catch(e){ return []; } }
/* 내려받은 파일은 초 단위라서 초까지만 맞춰 같은 기록을 한 번만 센다 */
const boardKey=e=>[Math.floor(e.t/1000),e.sid||'',e.case,e.role,e.kind,JSON.stringify(e.detail||{})].join('|');
function boardEvents(){
  const seen=new Set();
  return loadEvents().concat(loadClassEvents()).filter(e=>{ if(!BOARD_KINDS.includes(e.kind)) return false; const k=boardKey(e); if(seen.has(k)) return false; seen.add(k); return true; }).sort((a,b)=>a.t-b.t);
}
function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  text=String(text).replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ row.push(cell); cell=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=ch; }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
/* eventsCSV가 만든 파일을 다시 기록으로. 역사재판 기록 파일이 아니면 null */
function csvEvents(text){
  const R=parseCSV(text), h=R.shift()||[], ix=n=>h.indexOf(n);
  const I={t:ix('시각'),sid:ix('번호_별명'),case:ix('사건'),role:ix('역할'),day:ix('일차'),kind:ix('종류'),detail:ix('내용')};
  if(I.t<0||I.kind<0||I.case<0) return null;
  const out=[];
  R.forEach(r=>{ const kind=r[I.kind]; if(!BOARD_KINDS.includes(kind)) return;
    const m=/(\d{4})[-./]\s*(\d{1,2})[-./]\s*(\d{1,2})\.?\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/.exec(r[I.t]||''); if(!m) return;
    let detail={}; try{ detail=JSON.parse(r[I.detail]||'{}')||{}; }catch(e){}
    out.push({t:new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0)).getTime(),sid:(r[I.sid]||'').trim(),case:+r[I.case]||1,role:r[I.role]||'pros',day:+r[I.day]||0,kind:kind,detail:detail}); });
  return out;
}
const yearNum=s=>{ const m=/(기원전\s*)?(\d+)/.exec(s||''); return m?(m[1]?-m[2]:+m[2]):0; };
const eraOf=y=>y<0?'고조선':y<668?'삼국 시대':y<892?'남북국 시대':y<936?'후삼국 시대':y<1392?'고려':y<1897?'조선':'대한 제국';
const chargeNo=c=>{ const m=/혐의\s*([①-⑩])/.exec(c); return m?m[1]:'·'; };
/* 학생별·사건별로 모은다. 법관 등급은 rankUpdate와 같은 셈: 사건마다 한 판에서 처음 고른 판결이 맞은 수의 가장 큰 값을 더함 */
function boardData(E){
  const CS={}, ST={}, seg={};
  const cs=n=>CS[n]||(CS[n]={on:new Set(),done:new Set(),pick:{},first:{},paper:new Set(),self:new Set(),plum:new Set()});
  const st=s=>ST[s]||(ST[s]={sid:s,on:new Set(),done:new Set(),best:{},papers:new Set(),last:0});
  E.forEach(e=>{
    const sid=e.sid||'(이름표 없음)', n=+e.case||1, c=cs(n), s=st(sid), d=e.detail||{}, k=sid+'|'+n+'|'+e.role;
    s.last=Math.max(s.last,e.t); c.on.add(sid); s.on.add(n);
    if(e.kind==='start'&&!d.resume) seg[k]=new Set();
    else if(e.kind==='verdict_kind'){
      const ch=String(d.charge||''), fk=sid+'|'+e.role+'|'+ch;
      if(d.try===1&&!c.first[fk]) c.first[fk]={ch:ch,ok:!!d.ok,pick:d.pick};
      if(d.ok){ (c.pick[ch]||(c.pick[ch]={}))[sid+'|'+e.role]=d.pick; if(d.try===1) (seg[k]||(seg[k]=new Set())).add(ch); }
    }
    else if(e.kind==='paper'){ c.paper.add(sid); if(d.self) c.self.add(sid); if(d.plum) c.plum.add(sid); s.papers.add(n); }
    else if(e.kind==='case_end'){ c.done.add(sid); s.done.add(n); s.best[n]=Math.max(s.best[n]||0,seg[k]?seg[k].size:0); seg[k]=new Set(); }
  });
  return {CS:CS,ST:ST,n:Object.keys(ST).length};
}

/* 교사용 화면 안의 학급 연표: 판 + 학생별 표 + 기록 파일 합치기 */

function classBoardSection(){ return `<h3>학급 연표</h3><section id="cbWrap">${classBoardInner()}</section>`; }
function bindClassBoard(){
  const W=$('#cbWrap'); if(!W) return;
  const redraw=msg=>{ W.innerHTML=classBoardInner(msg); bindClassBoard(); };
  $('#cbBig').addEventListener('click',()=>openClassBoard(false));
  const f=$('#cbFile');
  $('#cbAdd').addEventListener('click',()=>f.click());
  f.addEventListener('change',async()=>{
    const L=loadClassEvents(), have=new Set(L.map(boardKey)); let files=0, bad=0, add=0;
    for(const file of [...(f.files||[])]){ let ev=null; try{ ev=csvEvents(await file.text()); }catch(e){} if(!ev){ bad++; continue; } files++;
      ev.forEach(e=>{ const k=boardKey(e); if(have.has(k)) return; have.add(k); L.push(e); add++; }); }
    L.sort((a,b)=>a.t-b.t); if(L.length>CLASSMAX) L.splice(0,L.length-CLASSMAX);
    let saved=true; try{ localStorage.setItem(CLASSKEY,JSON.stringify(L)); }catch(e){ saved=false; }
    redraw(!saved?'이 기기의 저장 공간이 모자라 합치지 못했어요.':`기록 파일 ${files}개를 합쳤어요. 새 기록 ${add}개.${bad?` 역사재판 기록이 아닌 파일 ${bad}개는 건너뛰었어요.`:''}`);
  });
  const c=$('#cbClear'); if(c) c.addEventListener('click',()=>{ let ok=false; try{ ok=window.confirm('다른 기기에서 합친 기록을 지울까요? 이 기기에서 쌓인 기록은 그대로 남아요.'); }catch(e){} if(ok){ store.set(CLASSKEY,'[]'); redraw('합친 기록을 지웠어요.'); } });
}

  if(!J7()) return await testimony(T,title);
  bgm('testimony'); await titleCard('― 증언 ―',title);
  const vis=T.lines.filter(l=>!l.hidden);
  for(let i=0;i<vis.length;i++) await say(T.who,vis[i].expr||'base',vis[i].text,{testimony:true,tag:`증언 ${i+1}/${vis.length}`});

  return await sortClaims(claims);
}
